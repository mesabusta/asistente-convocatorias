[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
    semana2: tests de la entrega de la semana 2
testpaths = tests
# Agrega la raíz del proyecto a sys.path para que `from centro...` funcione.
# Sin esto, invocar `pytest` directamente (como hace el pipeline) falla con
# ModuleNotFoundError: `python -m pytest` sí agrega el directorio actual, pero
# el ejecutable `pytest` no.
pythonpath = .
